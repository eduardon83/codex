<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background - ocean blue -->
  <circle cx="100" cy="100" r="100" fill="#0A2040"/>

  <!-- Water hint at bottom -->
  <ellipse cx="100" cy="172" rx="80" ry="20" fill="#0E3060" opacity="0.7"/>

  <!-- Body - round seal shape -->
  <ellipse cx="100" cy="128" rx="58" ry="46" fill="#4A5060"/>

  <!-- Pale belly patch - distinctive monk seal feature -->
  <ellipse cx="100" cy="140" rx="34" ry="30" fill="#C8C4B0"/>

  <!-- Flippers at bottom -->
  <ellipse cx="70" cy="162" rx="20" ry="10" fill="#3A4050" transform="rotate(-20 70 162)"/>
  <ellipse cx="130" cy="162" rx="20" ry="10" fill="#3A4050" transform="rotate(20 130 162)"/>

  <!-- Head - round chubby -->
  <ellipse cx="100" cy="90" rx="46" ry="44" fill="#50585A"/>

  <!-- Forehead slightly darker -->
  <ellipse cx="100" cy="72" rx="30" ry="20" fill="#3A4248"/>

  <!-- Nose - wide flat seal nose -->
  <ellipse cx="100" cy="102" rx="16" ry="10" fill="#2A3238"/>
  <ellipse cx="92" cy="100" rx="5" ry="4" fill="#1A2228"/>
  <ellipse cx="108" cy="100" rx="5" ry="4" fill="#1A2228"/>

  <!-- Eyes - big round dark - most distinctive seal feature -->
  <ellipse cx="80" cy="84" rx="14" ry="14" fill="#0A1218"/>
  <ellipse cx="120" cy="84" rx="14" ry="14" fill="#0A1218"/>
  <!-- Iris - very dark brown -->
  <ellipse cx="80" cy="84" rx="11" ry="11" fill="#1A2828"/>
  <ellipse cx="120" cy="84" rx="11" ry="11" fill="#1A2828"/>
  <!-- Pupil -->
  <circle cx="80" cy="84" r="7" fill="#080E10"/>
  <circle cx="120" cy="84" r="7" fill="#080E10"/>
  <!-- Big wet shine -->
  <circle cx="76" cy="80" r="4" fill="white" opacity="0.85"/>
  <circle cx="116" cy="80" r="4" fill="white" opacity="0.85"/>
  <circle cx="83" cy="87" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="123" cy="87" r="1.5" fill="white" opacity="0.4"/>

  <!-- Whiskers - long and prominent -->
  <line x1="60" y1="108" x2="84" y2="112" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="112" x2="84" y2="114" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="58" y1="116" x2="84" y2="116" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="140" y1="108" x2="116" y2="112" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="144" y1="112" x2="116" y2="114" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="142" y1="116" x2="116" y2="116" stroke="#D0C8B0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mouth - gentle curve -->
  <path d="M88,116 Q100,124 112,116" fill="none" stroke="#2A3238" stroke-width="2" stroke-linecap="round"/>

  <!-- Spots on pale belly -->
  <circle cx="94" cy="138" r="3" fill="#A8A498" opacity="0.5"/>
  <circle cx="107" cy="144" r="2.5" fill="#A8A498" opacity="0.4"/>
  <circle cx="96" cy="150" r="2" fill="#A8A498" opacity="0.4"/>
</svg>
